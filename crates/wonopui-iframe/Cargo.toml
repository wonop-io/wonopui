[package]
name = "wonopui-iframe"
version = "0.1.0"
edition = "2021"
authors = ["Troels F. Rønnow <troels@wonop.com>"]
description = "iframe component for WonopUI"
license = "MIT"
repository = "https://github.com/wonop-io/wonopui"

[dependencies]
wonopui-core = { path = "../wonopui-core" }
yew = { version = "0.21", features = ["csr"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlIFrameElement", "HtmlLinkElement",
    "HtmlStyleElement", "HtmlElement", "CssStyleDeclaration",
    "MouseEvent", "PointerEvent", "KeyboardEvent", "CustomEvent", "CustomEventInit",
    "NodeList",
    "MutationObserver", "MutationObserverInit",
    "ResizeObserver", "ResizeObserverEntry"
] }
gloo-utils = "0.2"

[package]
name = "wonopui-confirm-dialog"
version = "0.1.0"
edition = "2021"
authors = ["Troels F. Rønnow <troels@wonop.com>"]
description = "Confirm dialog component for WonopUI"
license = "MIT"
repository = "https://github.com/wonop-io/wonopui"

[dependencies]
wonopui-core = { path = "../wonopui-core" }
wonopui-button = { path = "../wonopui-button" }
yew = { version = "0.21", features = ["csr"] }
web-sys = { version = "0.3", features = ["Element", "DomTokenList", "EventTarget"] }
wasm-bindgen = "0.2"

[package]
name = "wonopui"
version = "0.1.0"
edition = "2021"
authors = ["Troels F. Rønnow <troels@wonop.com>"]
description = "WonopUI: A YEW UI framework for building flexible and customizable web applications."
license = "MIT"
repository = "https://github.com/wonop-io/wonopui"
homepage = "https://github.com/wonop-io/wonopui"
readme = "../../README.md"
keywords = ["yew", "tailwindcss", "ui"]
categories = ["web-programming"]

[features]
default = []

# Include all components
everything = [
    "accordion",
    "alert",
    "avatar",
    "badge",
    "breadcrumb",
    "browser-provider",
    "button",
    "calendar",
    "card",
    "carousel",
    "checkbox",
    "code-editor",
    "col",
    "collapsible",
    "color-picker",
    "component-editor",
    "combobox",
    "command",
    "confirm-dialog",
    "container",
    "content",
    "context-menu",
    "copy-button",
    "dark-mode-provider",
    "data-table",
    "date-picker",
    "dialog",
    "diffview",
    "divider",
    "drag-point",
    "drawer",
    "dropdown",
    "error-boundary",
    "group-button",
    "iframe",
    "input",
    "kanban",
    "label",
    "layout",
    "markdown-editor",
    "markdown-renderer",
    "media-query",
    "mention-input",
    "mermaid-diagram",
    "multicol-sidebar",
    "notification",
    "page-content",
    "page-header",
    "pagination",
    "paint-canvas",
    "placeholder",
    "popover",
    "progress",
    "resizable",
    "select",
    "selectable",
    "sidebar",
    "spinner",
    "status-dot",
    "status-indicator",
    "switch",
    "table",
    "tabs",
    "tag-input",
    "tailwind-color-picker",
    "textarea",
    "theme-provider",
    "toggle",
    "topbar",
    "typography",
    "window-controls",
    "window-provider",
]

# Individual component features
accordion = ["dep:wonopui-accordion"]
alert = ["dep:wonopui-alert"]
avatar = ["dep:wonopui-avatar"]
badge = ["dep:wonopui-badge"]
breadcrumb = ["dep:wonopui-breadcrumb"]
browser-provider = ["dep:wonopui-browser-provider"]
button = ["dep:wonopui-button"]
calendar = ["dep:wonopui-calendar"]
card = ["dep:wonopui-card"]
carousel = ["dep:wonopui-carousel"]
checkbox = ["dep:wonopui-checkbox"]
code-editor = ["dep:wonopui-code-editor"]
col = ["dep:wonopui-col"]
collapsible = ["dep:wonopui-collapsible"]
component-editor = ["dep:wonopui-component-editor"]
color-picker = ["dep:wonopui-color-picker"]
combobox = ["dep:wonopui-combobox"]
command = ["dep:wonopui-command"]
confirm-dialog = ["dep:wonopui-confirm-dialog"]
container = ["dep:wonopui-container"]
content = ["dep:wonopui-content"]
context-menu = ["dep:wonopui-context-menu"]
copy-button = ["dep:wonopui-copy-button"]
dark-mode-provider = ["dep:wonopui-dark-mode-provider", "media-query"]
data-table = ["dep:wonopui-data-table"]
date-picker = ["dep:wonopui-date-picker"]
dialog = ["dep:wonopui-dialog"]
diffview = ["dep:wonopui-diffview"]
divider = ["dep:wonopui-divider"]
drag-point = ["dep:wonopui-drag-point"]
drawer = ["dep:wonopui-drawer"]
dropdown = ["dep:wonopui-dropdown"]
error-boundary = ["dep:wonopui-error-boundary"]
group-button = ["dep:wonopui-group-button"]
iframe = ["dep:wonopui-iframe"]
input = ["dep:wonopui-input"]
kanban = ["dep:wonopui-kanban"]
label = ["dep:wonopui-label"]
layout = ["dep:wonopui-layout"]
markdown-editor = ["dep:wonopui-markdown-editor"]
markdown-renderer = ["dep:wonopui-markdown-renderer"]
media-query = ["dep:wonopui-media-query", "window-provider"]
mention-input = ["dep:wonopui-mention-input"]
mermaid-diagram = ["dep:wonopui-mermaid-diagram"]
multicol-sidebar = ["dep:wonopui-multicol-sidebar", "layout"]
notification = ["dep:wonopui-notification"]
page-content = ["dep:wonopui-page-content"]
page-header = ["dep:wonopui-page-header"]
pagination = ["dep:wonopui-pagination"]
paint-canvas = ["dep:wonopui-paint-canvas"]
placeholder = ["dep:wonopui-placeholder"]
popover = ["dep:wonopui-popover"]
progress = ["dep:wonopui-progress"]
resizable = ["dep:wonopui-resizable"]
select = ["dep:wonopui-select"]
selectable = ["dep:wonopui-selectable"]
sidebar = ["dep:wonopui-sidebar"]
spinner = ["dep:wonopui-spinner"]
status-dot = ["dep:wonopui-status-dot"]
status-indicator = ["dep:wonopui-status-indicator"]
switch = ["dep:wonopui-switch"]
table = ["dep:wonopui-table"]
tabs = ["dep:wonopui-tabs"]
tag-input = ["dep:wonopui-tag-input"]
tailwind-color-picker = ["dep:wonopui-tailwind-color-picker"]
textarea = ["dep:wonopui-textarea"]
theme-provider = ["dep:wonopui-theme-provider"]
toggle = ["dep:wonopui-toggle"]
topbar = ["dep:wonopui-topbar"]
typography = ["dep:wonopui-typography"]
window-controls = ["dep:wonopui-window-controls"]
window-provider = ["dep:wonopui-window-provider"]

[dependencies]
wonopui-core = { path = "../wonopui-core" }
yew = { version = "0.21", features = ["csr"] }
web-sys = { version = "0.3", features = ["KeyboardEvent"] }


[package]
name = "wonopui-dark-mode-provider"
version = "0.1.0"
edition = "2021"
authors = ["Troels F. Rønnow <troels@wonop.com>"]
description = "dark-mode-provider component for WonopUI"
license = "MIT"
repository = "https://github.com/wonop-io/wonopui"

[dependencies]
wonopui-core = { path = "../wonopui-core" }
wonopui-media-query = { path = "../wonopui-media-query" }
yew = { version = "0.21", features = ["csr"] }
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlElement", "DomTokenList"] }

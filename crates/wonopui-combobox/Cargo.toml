[package]
name = "wonopui-combobox"
version = "0.1.0"
edition = "2021"
authors = ["Troels F. Rønnow <troels@wonop.com>"]
description = "combobox component for WonopUI"
license = "MIT"
repository = "https://github.com/wonop-io/wonopui"

[dependencies]
wonopui-core = { path = "../wonopui-core" }
yew = { version = "0.21", features = ["csr"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Document", "Node", "Element", "FocusEvent", "MouseEvent"] }
gloo-events = "0.2"
gloo-timers = "0.3"

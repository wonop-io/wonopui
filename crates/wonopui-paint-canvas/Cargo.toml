[package]
name = "wonopui-paint-canvas"
version = "0.1.0"
edition = "2021"
authors = ["Troels F. Rønnow <troels@wonop.com>"]
description = "paint-canvas component for WonopUI"
license = "MIT"
repository = "https://github.com/wonop-io/wonopui"

[dependencies]
wonopui-core = { path = "../wonopui-core" }
yew = { version = "0.21", features = ["csr"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "HtmlCanvasElement", "CanvasRenderingContext2d", "Element",
    "DomRect", "PointerEvent"
] }

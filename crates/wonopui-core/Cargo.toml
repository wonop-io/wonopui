[package]
name = "wonopui-core"
version = "0.1.0"
edition = "2021"
authors = ["Troels F. Rønnow <troels@wonop.com>"]
description = "Core utilities and types for WonopUI components"
license = "MIT"
repository = "https://github.com/wonop-io/wonopui"

[dependencies]
yew = { version = "0.21", features = ["csr"] }
web-sys = { version = "0.3.68", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "DomRect",
    "DomTokenList",
] }
wasm-bindgen = { version = "0.2.90" }
gloo = "0.11.0"
log = "0.4.20"

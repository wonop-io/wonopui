# cargo-deny configuration for WonopUI
# https://embarkstudios.github.io/cargo-deny/

[graph]
# Exclude dev dependencies from checks (they're not shipped)
exclude-dev = true

[advisories]
# The database of known vulnerabilities
db-path = "~/.cargo/advisory-db"

# Ignore advisories for unmaintained transitive dependencies we can't control
# These are pulled in by yew and related crates
ignore = [
    # bincode - unmaintained but stable, pulled in by gloo-worker (yew dependency)
    "RUSTSEC-2025-0141",
    # fxhash - unmaintained, pulled in by scraper (gallery example only)
    "RUSTSEC-2025-0057",
    # proc-macro-error - unmaintained, pulled in by yew-macro and validator_derive
    "RUSTSEC-2024-0370",
    # idna - vulnerability in validator (gallery example), needs validator upgrade
    # TODO: Upgrade validator to get fixed idna version
    "RUSTSEC-2024-0421",
]

[licenses]
# List of allowed licenses
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "MPL-2.0",
]

# Confidence threshold for license detection
confidence-threshold = 0.8

# Private crates don't need license checks
[licenses.private]
ignore = true

# Exceptions for specific crates with non-standard licenses
[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
# Deny multiple versions of the same crate
multiple-versions = "warn"

# Deny specific crates
deny = []

# Skip checking for duplicate versions of these crates
skip = []

# Allow specific crates
allow = []

# Highlight specific crates in dependency graphs
highlight = "all"

[sources]
# Only allow crates from crates.io
unknown-registry = "deny"

# Only allow git sources from these organizations
unknown-git = "deny"

# Allowed git repositories
allow-git = []

[sources.allow-org]
# Allow crates from these GitHub organizations
github = []

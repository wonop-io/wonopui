<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="description" content="Documentation for Wonop UI" />
        <title>Wonop UI Documentation</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <style>
            /* Code Editor Styles */
            .wonopui-code-editor {
                font-family: "Menlo", "Monaco", "Courier New", monospace;
                font-size: 14px;
                line-height: 1.5;
                tab-size: 4;
                position: relative;
                overflow: hidden;
                border-radius: 4px;
            }
            .wonopui-code-editor-light { background-color: #ffffff; color: #333333; }
            .wonopui-code-editor-dark { background-color: #1e1e1e; color: #d4d4d4; }
            .wonopui-code-editor .line-numbers { user-select: none; text-align: right; padding: 0.5rem; border-right: 1px solid #e0e0e0; }
            .wonopui-code-editor .code-display { white-space: pre; padding: 0.5rem; }
        </style>
    </head>

            import init from './gallery_wasm.js';
            init();
        </script>
    </body>
